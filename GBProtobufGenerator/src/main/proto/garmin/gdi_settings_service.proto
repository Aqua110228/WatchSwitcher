syntax = "proto2";

package garmin_vivomovehr;

option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin.GdiSettingsService";
option java_multiple_files = true;

message SettingsService {
  optional ScreenDefinitionRequest definitionRequest = 1;
  optional ScreenDefinitionResponse definitionResponse = 2;

  optional ScreenStateRequest stateRequest = 3;
  optional ScreenStateResponse stateResponse = 4;

  optional ChangeRequest changeRequest = 5;
  optional ChangeResponse changeResponse = 6;

  optional ChangeNotification changeNotification = 7;

  optional InitRequest initRequest = 8;
  optional InitResponse initResponse = 9;

  optional Message11 unk11 = 11;
  optional Message13 unk13 = 13;

  message Message11 {
    optional uint32 unk1 = 1;
  }

  message Message13 {
  }
}

message ScreenDefinitionRequest {
  optional uint32 screenId = 1;
  optional uint32 unk2 = 2; // 0
  optional string locale = 3; // en_US
}

message ScreenDefinitionResponse {
  optional uint32 status = 1; // 0 = success, 2 = fail
  optional ScreenDefinition definition = 2;
}

message ScreenDefinition {
  optional uint32 screenId = 1;
  optional uint32 unk2 = 2; // 0
  optional uint32 unk3 = 3; // 928002
  optional Label title = 4;
  repeated ScreenEntry entry = 5;
  repeated MenuEntry menu_entry = 6;
}

message Label {
  optional string id = 1;
  optional string text = 2;
  repeated string unk3 = 3;
  repeated bytes unk4 = 4;
}

message ScreenEntry {
  message Message6 {
    optional uint32 unk1 = 1;
    optional string unk2 = 2;
    optional uint32 unk3 = 3;
  }
  message Message7 {

  }
  message Message8 {
  }

  message Action {
    optional MenuMessage unk1 = 1;
  }
  message Message14 {
    optional uint32 unk1 = 1;
    optional uint32 unk2 = 2;
    optional uint32 unk3 = 3;
    optional uint32 unk4 = 4;
  }
  message Message15 {
    optional Label unk1 = 1;
    optional Label unk2 = 2;
  }
  message Message18 {
    optional uint32 unk1 = 1;
    optional uint32 unk2 = 2;
  }
  optional uint32 id = 1;
  optional RowType rowType = 2;
  optional Label title = 3;
  optional uint32 unk4 = 4;
  optional Icon icon = 5;
  optional Message6 unk6 = 6;
  optional Message7 unk7 = 7;
  optional Message8 unk8 = 8;
  optional Target target = 9;
  optional Action action = 10;
  optional Icon iconRight = 11;
  optional SortOptions sortOptions = 12;
  optional TextOption textOption = 13;
  optional Message14 unk14 = 14;
  optional Message15 unk15 = 15; // info text if nothing can be set?
  optional Icon iconLeft = 17;
  optional Message18 unk18 = 18;
}

message SortOptions {
  optional uint32 unk3 = 3; // 1
  repeated SortEntry entries = 5;
}

message SortEntry {
  message Message6 {
      optional uint32 unk1 = 1;
      optional uint32 unk2 = 2;
  }
  optional uint32 id = 1;
  optional Label title = 2;
  optional uint32 unk5 = 5; // 1
  optional Message6 unk6 = 6;
}

message TextOption {
  enum Keyboard {
      ALPHANUMERIC = 0;
      INTEGER = 1;
      FLOAT = 2;
  }
  optional TextLimits limits = 1;
  optional Keyboard keyboard = 2;
  optional IntegerLimits integerLimits = 3;
}

message TextLimits {
  optional uint32 maxLength = 1;
}

message IntegerLimits {
    optional int32 minValue = 1;
    optional int32 maxValue = 2;
}

message FloatLimits {
    optional float minValue = 1;
    optional float maxValue = 2;
    optional int32 precision = 3;
}


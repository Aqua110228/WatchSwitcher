  message DurationOptions {
    optional uint32 minSeconds = 1;
    optional uint32 maxSeconds = 2;
    optional uint32 stepSize = 3;
  }
  message FloatOptions {
    optional float minValue = 1;
    optional float maxValue = 2;
    optional uint32 unk3 = 3;
    optional float stepSize = 4;
  }
  message CIQ {
    optional int32 unk1 = 1;
    optional bytes store_app = 2;
    optional uint32 app_type = 5;
    optional uint32 unk6 = 6;
  }
  optional Type type = 1;
  optional uint32 subscreen = 2; // when 0
  optional Activity activity = 3; // when 6
  optional TargetOptions options = 4; // when 1
  optional DurationOptions durationOptions = 5;
  optional FloatOptions floatOptions = 7;
  optional IntegerPicker integerPicker = 8;
  optional CIQ ciq = 11;
}

message ScreenStateRequest {
  optional uint32 screenId = 1;
}

message TargetOptions {
  repeated TargetOptionEntry option = 1;
  repeated MenuEntry menu_entry = 2;
  optional uint32 unk3 = 3;
}

message TargetOptionEntry {
  message Message7 {
    optional uint32 unk1 = 1;
    optional uint32 unk2 = 2;
    optional uint32 unk3 = 3;
    optional uint32 unk4 = 4;
  }
  optional uint32 unk1 = 1;
  optional RowType rowType = 2;
  optional Label title = 3;
  optional Label subtitle = 4;
  optional Icon icon = 6;
  optional Message7 unk7 = 7;
}

message IntegerPicker {
  optional uint32 min = 1;
  optional uint32 max = 2;
  optional uint32 step = 3; // maybe? 1 on weight
}

message ScreenStateResponse {
  optional uint32 unk1 = 1; // 0
  optional ScreenState state = 2;
}

message ScreenState {
  optional uint32 screenId = 1;
  optional uint32 unk2 = 2; // 0
  optional uint32 unk3 = 3; // 928002
  repeated EntryState state = 4;
}

message EntryState {
  message Message7 {
    optional Label label1 = 1;
    optional Label label2 = 2;
  }
  message Message8 {
    optional uint32 unk1 = 1;
  }
  message Message9 {
    optional Label label1 = 1;
  }
  message AlertSettings {
      optional string dialect = 1;
  }
  optional uint32 id = 1;
  optional uint32 state = 2;
  optional Switch switch = 3;
  optional Summary summary = 4;
  optional AlertSettings alertSettings = 6;
  optional Message7 unk7 = 7;
  optional Message8 unk8 = 8;
  optional Message9 unk9 = 9;
}

message Switch {
  optional bool enabled = 1;
  optional Label title = 2;
}

message Summary {
  optional Label title = 1;
  optional ValueList valueList = 2;
  optional ValueDuration valueDuration = 3;
  optional ValueTimeOfDay valueTimeOfDay = 4;
  optional ValueFloat valueFloat = 5;
  optional ValueInteger valueInteger = 6;
  optional ValueDate valueDate = 8;
  optional ValueHeight valueHeight = 10;
}

message ValueList {
  optional uint32 index = 1;
}

message ValueTimeOfDay {
  optional uint32 seconds = 1;
  optional Label formatted = 2;
  optional uint32 timeFormat = 3; // 0 12h, 1 24h
}

message ValueDuration {
  optional uint32 seconds = 1;
  optional Label formatted = 2;
  optional Label titel = 3;
}

message ValueFloat {
  optional float value = 1;
  optional Label formatted = 2;
  optional Label title = 3;
  optional Label uom = 4;
}

message ValueInteger {
  optional uint32 value = 1;
  optional Label formatted = 2;
  optional Label title = 3;
  optional Label unit = 4;
}

message ValueDate {
  optional Label subtitle = 1;
  optional Date currentDate = 2;
  optional Date minDate = 3;
  optional Date maxDate = 4;
}

message ValueHeight {
  optional Label subtitle = 1;
  optional uint32 value = 2;
  optional uint32 unit = 3; // 0 cm
}

message Date {
  optional uint32 month = 1;
  optional uint32 day = 2;
  optional uint32 year = 3;
}

message ChangeRequest {
  optional uint32 screenId = 1;
  optional uint32 entryId = 2;
  optional Switch switch = 3;
  optional Option option = 4;
  optional Time duration = 5;
  optional Time timeOfDay = 6;
  optional FloatValue floatValue = 7;
  optional IntegerValue integerValue = 8;
  optional Position position = 11;
  optional NewDate newDate = 12;
  optional Text text = 14;
  optional Height height = 15;

  message Switch {
    required bool value = 1;
  }
  message Option {
    optional uint32 index = 1;
  }
  message Time {
    optional uint32 seconds = 1;
  }
  message IntegerValue {
    optional uint32 value = 1;
  }
  message Position {
    optional uint32 index = 1;
    optional bool delete = 2;
  }
  message NewDate {
    optional Date value = 1;
  }
  message Text {
    optional string value = 1;
  }
  message Height {
    optional uint32 value = 1;
    optional uint32 unit = 2;
  }
  message FloatValue {
    optional float value = 1;
  }
}

message ChangeResponse {
  message Message2 {
    optional Label unk1 = 1;
    optional Label unk2 = 2;
    optional Label unk3 = 3;
  }
  optional ResponseStatus status = 1;
  optional Message2 unk2 = 2;
  optional ScreenState state = 3;
  optional bool unk4 = 4;
  optional bool shouldReturn = 5;
}

message InitRequest {
  optional string language = 1; // en_US
  optional string region = 2; // us
}

message InitResponse {
  optional string part_number_1 = 1;
  optional string part_number_2 = 2;
  repeated uint32 unk3 = 3;
  optional uint32 unk4 = 4;
}

enum ResponseStatus {
  SUCCESS = 0;
  GENERIC_ERROR = 1;
}

message ChangeNotification {
}

message MenuMessage {
  optional Label titel = 1;
  optional Label message = 2;
  optional Label yes = 3;
  optional Label no = 4;
  optional uint32 unk5 = 5;
  optional uint32 unk6 = 6;
}

message MenuEntry {
  optional uint32 unk1 = 1;
  optional uint32 unk2 = 2;
  optional Label label = 3;
  optional uint32 unk4 = 4;
  optional Target target = 5;
  optional uint32 unk6 = 6;
  optional uint32 unk7 = 7;
  optional MenuMessage menu_message = 9;
}


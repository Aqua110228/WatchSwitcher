syntax = "proto2";
package xiaomi;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.xiaomi";
option java_multiple_files = true;
import "xiaomi/wear_common.proto";

message Health {
  optional UserInfo userInfo = 1;

  // 8, 2 get today | 8, 3 get past
  optional bytes activityRequestFileIds = 2;
  //
  optional bytes activitySyncAckFileIds = 3;
  optional ActivitySyncRequestToday activitySyncRequestToday = 5;

  optional SpO2 spo2 = 7;
  optional HeartRate heartRate = 8;
  // 8, 12 get | 8, 13 set
  optional StandingReminder standingReminder = 9;
  optional Stress stress = 10;
  optional GoalNotification goalNotification = 13;

  // 8, 35 get | 8, 36 set
  optional VitalityScore vitalityScore = 14;

  // 8, 26
  optional WorkoutStatusWatch workoutStatusWatch = 20;

  // 8, 29
  optional WorkoutStatusWatchV2 workoutStatusWatchV2 = 24;

  // 8, 30
  optional WorkoutOpenWatch workoutOpenWatch = 25;
  optional WorkoutOpenReply workoutOpenReply = 26;

  // 7, 43
  optional GoalsConfig goalsConfig = 38;

  // 7, 48
  optional WorkoutLocation workoutLocation = 40;

  // 8,45 enable | 8, 46 disable | 8, 47 periodic
  optional RealTimeStats realTimeStats = 39;

  // 8, 53 -- raw sensor batches (SaA synthetic workout, ~100 Hz, watch -> phone)
  optional RawSensorBatch rawSensorBatch = 15;
  // 8, 49 -- live workout stats, phone -> watch (AstroBox FitnessID.PHONE_SPORT_DATA_V2A)
  optional WorkoutStatsPhone workoutStatsPhone = 41;
  // 8, 50 -- live workout stats, watch -> phone (AstroBox FitnessID.WEAR_SPORT_DATA_V2A)
  optional WorkoutStatsWatch workoutStatsWatch = 42;
}

message UserInfo {
  optional uint32 height = 1; // cm
  optional float weight = 2; // kg
  optional uint32 birthday = 3; // YYYYMMDD
  optional uint32 gender = 4; // 1 male, 2 female
  optional uint32 maxHeartRate = 5;
  optional uint32 goalCalories = 6;
  optional uint32 goalSteps = 7;
  optional uint32 goalStanding = 9; // hours
  optional uint32 goalMoving = 11; // minutes
}

message ActivitySyncRequestToday {
  optional uint32 unknown1 = 1; // 0 most of the time, sometimes 1; possibly a sync mode flag (0=normal sync, 1=force/full sync)
}

message SpO2 {
  optional uint32 unknown1 = 1; // 1
  // Was bool allDayTracking: the band uses a numeric mode instead
  // (0 = off, 1 = sleep-only, 2 = all-day). Sending bool true (1)
  // enabled sleep-only tracking instead of all-day tracking.
  // Note: sleep-only is valid on the wire but is not exposed in
  // the on-watch UI nor in the vendor app UI of Mi Band 10,
  // so a band left in that state just looks off to the user.
  optional Spo2Mode mode = 2;
  optional Spo2AlarmLow alarmLow = 4;
}

enum Spo2Mode {
  SPO2_MODE_OFF = 0;
  SPO2_MODE_SLEEP_ONLY = 1;
  SPO2_MODE_ALL_DAY = 2;
}

message Spo2AlarmLow {
  optional bool alarmLowEnabled = 1;
  optional uint32 alarmLowThreshold = 2; // 90, 85, 80
}

message HeartRate {
  optional bool disabled = 1; // 0 enabled 1 disabled
  optional uint32 interval = 2; // 0 smart 1 10 30
  optional bool alarmHighEnabled = 3;
  optional uint32 alarmHighThreshold = 4; // 100, 110, ... 150
  optional AdvancedMonitoring advancedMonitoring = 5;
  optional uint32 unknown7 = 7; // 1
  optional HeartRateAlarmLow heartRateAlarmLow = 8;
  optional uint32 breathingScore = 9; // 1 on, 2 off
}

message AdvancedMonitoring {
  required bool enabled = 1;
}

message HeartRateAlarmLow {
  optional bool alarmLowEnabled = 1;
  optional uint32 alarmLowThreshold = 2; // 40, 45, 50
}

message StandingReminder {
  optional bool enabled = 1;
  optional HourMinute start = 2;
  optional HourMinute end = 3;
  optional bool dnd = 4;
  optional HourMinute dndStart = 6;
  optional HourMinute dndEnd = 7;
}

message Stress {
  optional bool allDayTracking = 1;
  optional RelaxReminder relaxReminder = 2;
}

message GoalNotification {
  optional bool enabled = 1;
  optional uint32 unknown2 = 2; // 1
}

message RelaxReminder {
  optional bool enabled = 1;
  optional uint32 unknown2 = 2; // 0
}

message VitalityScore {
  optional bool sevenDay = 1;
  optional bool dailyProgress = 2;
}

message WorkoutStatusWatch {
  optional uint32 timestamp = 1; // seconds
  optional WorkoutStatusWatchSport sportInfo = 2;
  optional uint32 sport = 3;
  optional uint32 status = 4; // 0 started, 1 paused, 2 resumed, 3 finished
  optional bytes activityFileIds = 5;
  // The protocol versions the phone accepts, answering supportedVersions in WorkoutOpenWatch.
  optional uint32 supportedVersions = 6; // 2; 3 in SaA synthetic-workout mode
  optional uint32 unknown10 = 10; // 0
}

message WorkoutStatusWatchSport {
  // Local UTC offset in quarter-hour units, DST included. Zigzag encoded, like TimeZone in
  // wear_common.proto.
  optional sint32 tzOffsetQuarterHours = 1;
}

// The watch asks the phone to confirm a workout it is about to open.
message WorkoutOpenWatch {
  // 1 outdoor running, 2 walking, 3 hiking, 4 trekking, 5 trail run, 6 outdoor cycling
  optional uint32 sport = 1;
  // The protocol versions the watch accepts for this workout.
  optional uint32 supportedVersions = 2;
  // The sport this one belongs to within a multi-sport session, equal to sport otherwise.
  optional uint32 mainSport = 3;
}

// The watch does not open the workout until this arrives.
message WorkoutOpenReply {
  // 0 ok, 1 busy, 2 sport type mismatch, 3 no permission, 4 sport unsupported,
  // 5 insufficient location accuracy, 6 charging, 7 low battery, 8 version unsupported,
  // 9 wear mode mismatch, 10 unknown
  optional uint32 code = 1;
  // One of the versions the watch offered in supportedVersions.
  optional uint32 selectedVersion = 2;
  // Accuracy of the location the phone will supply: 0 low or none, 1 medium, 2 high, 10 unknown.
  optional uint32 gpsAccuracy = 3;
}

message GoalsConfig {
  repeated Goal currentGoals = 1;
  repeated Goal supportedGoals = 2;
}

message Goal {
  // 1 steps?
  // 2 calories?
  // 3 moving time
  // 4 standing time
  optional uint32 id = 1;
}

message WorkoutLocation {
  optional uint32 unknown1 = 1; // 10, sometimes 2?
  optional uint32 timestamp = 2; // seconds
  optional double longitude = 3;
  optional double latitude = 4;
  optional double altitude = 5;
  optional float speed = 6;
  optional float bearing = 7;
  optional float horizontalAccuracy = 8;
  optional float verticalAccuracy = 9;
}

message WorkoutStatusWatchV2 {
  optional uint32 status = 1;    // 0 started, 1 resumed, 2 paused, 3 finished
  optional uint32 timestamp = 2; // Unix epoch seconds
  optional WorkoutStatusWatchV2Sport sport = 3;
  optional uint32 unknown7 = 7;  // observed value 2
}

message WorkoutStatusWatchV2Sport {
  optional uint32 type = 1; // sport type (same codes as WorkoutOpenWatch.sport)
}

message RealTimeStats {
  optional uint32 steps = 1;
  optional uint32 calories = 2;
  optional uint32 unknown3 = 3; // increases during activity
  optional uint32 heartRate = 4;
  optional uint32 unknown5 = 5; // 0 probably moving time
  optional uint32 standingHours = 6;
}

// SaA raw-sensor batch sent by band during a synthetic workout (subtype 53
// = AstroBox FitnessID.WEAR_SENSOR_DATA). Each batch carries 10 accel + 10 gyro samples.
// Mirrors AstroBox AxisSensor (wear_fitness.proto:757); we use optional vs required only.
message AxisSensor {
  optional uint64 timestamp = 1; // varint, likely nanoseconds since boot
  optional float x = 2; // m/s^2 (fixed32 little-endian)
  optional float y = 3;
  optional float z = 4;
}

// Field tags 5/6 are what Mi Band 10 emits on the wire — they do NOT match
// AstroBox WearSensorData (accel/gyro = 1/2 there), so this stays a separate message.
message RawSensorBatch {
  repeated AxisSensor accel = 5;
  repeated AxisSensor gyro = 6; // not consumed today
}

// Live workout stats pushed by the phone during a phone-driven workout (subtype 49 = AstroBox
// FitnessID.PHONE_SPORT_DATA_V2A). The band renders these values on its workout screen; it never
// computes them itself while the phone owns the session, and blanks the screen if the stream
// stops altogether.
// Tags beyond 4 exist on the wire but are not needed here.
message WorkoutStatsPhone {
  optional uint32 durationSeconds = 1;
  optional uint32 heartRate = 2; // bpm, 255 when unknown
  optional uint32 calories = 3; // kcal
  optional uint32 distance = 4; // metres
}

// The watch's own copy of the stats, pushed once a second for as long as a workout is open,
// whatever rate the phone sends at. Tags beyond 4 exist on the wire but are not consumed here.
message WorkoutStatsWatch {
  optional uint32 heartRate = 1; // bpm
  optional uint32 calories = 2; // kcal, counted from the start of the workout
  optional uint32 steps = 3;
  optional uint32 distance = 4; // metres
}
